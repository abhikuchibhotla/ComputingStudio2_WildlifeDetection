<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildlife Detection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #aaa;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    #result {
      width: 100%;
      max-width: 640px;
      border-radius: 10px;
      background: #222;
      display: block;
      margin-top: 16px;
      min-height: 40px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      max-width: 640px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active { background: #1d4ed8; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h2 style="margin-top: 20px;">Wildlife Detection</h2>
  <input type="file" id="fileInput" accept="image/*" style="margin-top: 20px; color: #aaa;">
  <button id="uploadBtn" onclick="uploadFile()" style="margin-top: 10px;">Upload & Detect</button>
  <p id="status"></p>
  
  <div id="comparison-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 1280px; margin-top: 20px;">
    <div style="text-align: center;">
      <p style="color: #888; font-size: 0.8rem; margin-bottom: 5px;">Detection</p>
      <img id="result" style="width: 100%; max-width: 600px; border-radius: 10px; background: #222;" />
    </div>
    <div style="text-align: center;">
      <p style="color: #888; font-size: 0.8rem; margin-bottom: 5px;">Depth Map</p>
      <img id="depthResult" style="width: 100%; max-width: 600px; border-radius: 10px; background: #222;" />
    </div>
  </div>

  <script>
    const result = document.getElementById("result");
    const depthResult = document.getElementById("depthResult");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");

    function uploadFile() {
      const file = fileInput.files[0];
      if (!file) {
        if (status) status.textContent = "Please select a file first.";
        return;
      }

      if (uploadBtn) uploadBtn.disabled = true;
      if (status) status.textContent = "Uploading...";

      const formData = new FormData();
      formData.append("image", file);

      fetch("/detect", {
        method: "POST",
        body: formData
      })
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          if (status) status.textContent = "Error: " + data.error;
        } else {
          result.src = data.annotated_image;
          depthResult.src = data.depth_map;
          if (status) status.textContent = "Done!";
        }
      })
      .catch(err => {
        if (status) status.textContent = "Request failed: " + err.message;
      })
      .finally(() => {
        if (uploadBtn) uploadBtn.disabled = false;
      });
    }
  </script>
</body>
</html>
